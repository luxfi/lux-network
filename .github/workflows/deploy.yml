name: Build static image

# lux.network is served via the unified Hanzo infra: this workflow builds one
# semver image (ghcr.io/luxfi/lux-network — the Next static export baked into
# ghcr.io/hanzoai/static) on the self-hosted arcd runner. luxfi/universe pins
# the tag and the operator/PaaS reconciles it onto DOKS behind hanzoai/ingress.
# No GitHub Pages, no GitHub-hosted builders, no Cloudflare-by-hand.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lux-network-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/luxfi/lux-network

jobs:
  build:
    runs-on: [self-hosted, linux, amd64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=lux-network
          cache-to: type=gha,mode=max,scope=lux-network
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_LOGIN_SITE_URL=https://lux.id/login
